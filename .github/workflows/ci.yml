name: Validate ISP Manager
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser functional tests
        run: |
          npm run dev > /tmp/isp-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Production PWA tests
        run: |
          npm run preview > /tmp/isp-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isp-manager-test-results
          path: test-results/
